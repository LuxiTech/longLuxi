# Variant of fsdp2_cards0_3.yaml with CPU offload for 256K headline run.
# Trades training speed (~2-3x slowdown) for ~24 GiB/card freed.
# Use only when ctx ≥ 256K and standard FSDP2 OOMs.
compute_environment: LOCAL_MACHINE
debug: false
distributed_type: FSDP
downcast_bf16: 'no'
fsdp_config:
  fsdp_version: 2
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen3_5DecoderLayer
  fsdp_cpu_ram_efficient_loading: true
  fsdp_offload_params: true             # was: false — frees ~8 GiB/card
  fsdp_reshard_after_forward: true
  fsdp_state_dict_type: FULL_STATE_DICT
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 4
rdzv_backend: static
same_network: true
use_cpu: false
