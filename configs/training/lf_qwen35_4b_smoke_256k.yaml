### model
model_name_or_path: /home/user01/Minko/models/Qwen3.5-4B
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true   # fused linear+CE; without it the 248k-vocab logits tensor OOMs even with FSDP2

### method
stage: pt
do_train: true
finetuning_type: full

### dataset
dataset: longluxi_packed_256k
dataset_dir: external/LLaMA-Factory/data
template: empty
cutoff_len: 262144
max_samples: 30
preprocessing_num_workers: 8
dataloader_num_workers: 2
packing: false
neat_packing: false

### output
output_dir: checkpoints/phase3a_smoke_256k
logging_steps: 1
save_steps: 1               # save after step 1 in case later steps OOM
save_total_limit: 1
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 1
max_steps: 3
learning_rate: 5.0e-6
warmup_ratio: 0.0
lr_scheduler_type: constant
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
