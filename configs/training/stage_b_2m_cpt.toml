# Stage B: 2M dense continued pretraining
# 周次: W4-5
# 起点: Stage A 的 1M reader checkpoint
# 目标: dense 推到 2M，RULER 2M multi-needle ≥ 70%

[run]
name = "qwen3.5-4b-2m-cpt"
seed = 42
output_dir = "checkpoints/stage_b_2m"
resume_from = "checkpoints/stage_a_1m/latest"

[model]
base_id = "Qwen/Qwen3.5-4B"
yarn_config = "configs/yarn/yarn_2m.json"
attn_impl = "flash_attention_2"
dtype = "bfloat16"
gradient_checkpointing = true
selective_recompute = true

[training]
context_length = 2097152       # 2M
micro_batch_size = 1
global_batch_tokens = 2097152
gradient_accumulation = 1
max_steps = 100                # 100 * 2M = 200M tokens
learning_rate = 3.0e-6         # 比 1M 略低，避免破坏 1M 学到的东西
lr_scheduler = "cosine_with_warmup"
warmup_steps = 5
weight_decay = 0.01
max_grad_norm = 1.0

[parallelism]
context_parallel_degree = 16
context_parallel_rotate_method = "allgather"
tensor_parallel_degree = 1
data_parallel_degree = 1

[checkpoint]
save_every_steps = 25
keep_last = 3
async_save = true

[data]
mix_file = "data/processed/cpt_mix_2m.jsonl"
packing = "doc_separator"
cross_doc_attention_mask = true
# 2M 阶段做更激进的长度上采样
length_upsampling = "configs/training/length_upsampling_2m.yaml"

[eval]
eval_every_steps = 20
benchmarks = ["niah_512k", "niah_1m", "niah_2m_subset", "ruler_1m_subset", "ruler_2m_subset"]
short_eval = ["mmlu_subset"]
