# Stage A: 1M dense continued pretraining
# 周次: W2-3
# 目标: 把 Qwen3.5-4B 从「YaRN static 1M」推到「数据驱动的 1M reader」
# 成功标准: RULER 1M ≥ +10pp over base+static YaRN，短能力退化 ≤ 3%

[run]
name = "qwen3.5-4b-1m-cpt"
phase = "smoke"  # "smoke" -> 50M tokens; "main" -> 250M tokens
seed = 42
output_dir = "checkpoints/stage_a_1m"
resume_from = ""  # empty -> from base

[model]
base_id = "Qwen/Qwen3.5-4B"
yarn_config = "configs/yarn/yarn_1m.json"
attn_impl = "flash_attention_2"  # standard 层；GDN 层走 FLA kernel
dtype = "bfloat16"
gradient_checkpointing = true
selective_recompute = true

[training]
context_length = 1048576       # 1M
micro_batch_size = 1           # sequences
global_batch_tokens = 1048576  # 1 seq * 1M
gradient_accumulation = 1
max_steps_smoke = 50           # 50 * 1M = 50M tokens
max_steps_main = 250           # 250 * 1M = 250M tokens
learning_rate = 5.0e-6
lr_scheduler = "cosine_with_warmup"
warmup_steps = 10
weight_decay = 0.01
adam_beta1 = 0.9
adam_beta2 = 0.95
adam_eps = 1.0e-8
max_grad_norm = 1.0

[parallelism]
# flame / torchtitan 配置
context_parallel_degree = 16
context_parallel_rotate_method = "allgather"
tensor_parallel_degree = 1
data_parallel_degree = 1
pipeline_parallel_degree = 1

[checkpoint]
save_every_steps_smoke = 25
save_every_steps_main = 50
keep_last = 3
async_save = true

[data]
mix_file = "data/processed/cpt_mix_1m.jsonl"
packing = "doc_separator"      # 多文档拼接，<doc> separator + cross-doc mask
cross_doc_attention_mask = true
length_upsampling = "configs/training/length_upsampling.yaml"

[eval]
# 训练中每 N steps 跑一组轻量 eval
eval_every_steps = 25
benchmarks = ["niah_128k", "niah_512k", "niah_1m_subset", "ruler_128k_subset"]
short_eval = ["mmlu_subset"]   # 防短能力退化
