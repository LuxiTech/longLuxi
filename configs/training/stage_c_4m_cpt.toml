# Stage C: 4M dense continued pretraining (STRETCH / OPTIONAL)
# 周次: W6-7
# 起点: Stage B 的 2M reader checkpoint
# 触发条件: Stage B 全部成功标准达标 + 时间预算充足
# 风险: 4M 通信、显存压力大；不稳即终止回滚到 2M reader

[run]
name = "qwen3.5-4b-4m-cpt"
seed = 42
output_dir = "checkpoints/stage_c_4m"
resume_from = "checkpoints/stage_b_2m/latest"
go_no_go_required = true

[model]
base_id = "Qwen/Qwen3.5-4B-Instruct"
yarn_config = "configs/yarn/yarn_4m.json"
attn_impl = "flash_attention_2"
dtype = "bfloat16"
gradient_checkpointing = true
selective_recompute = "aggressive"   # 4M 必须激进 recompute

[training]
context_length = 4194304       # 4M
micro_batch_size = 1
global_batch_tokens = 4194304
gradient_accumulation = 1
max_steps = 25                 # 25 * 4M = 100M tokens
learning_rate = 2.0e-6
lr_scheduler = "constant"
warmup_steps = 3
weight_decay = 0.01
max_grad_norm = 1.0

[parallelism]
context_parallel_degree = 16
context_parallel_rotate_method = "allgather"
tensor_parallel_degree = 1
data_parallel_degree = 1

[checkpoint]
save_every_steps = 5
keep_last = 5
async_save = true

[data]
mix_file = "data/processed/cpt_mix_4m.jsonl"
packing = "doc_separator"
cross_doc_attention_mask = true

[eval]
eval_every_steps = 5
benchmarks = ["niah_1m", "niah_2m", "niah_4m_subset", "ruler_2m_subset", "passkey_4m"]
short_eval = ["mmlu_subset"]
