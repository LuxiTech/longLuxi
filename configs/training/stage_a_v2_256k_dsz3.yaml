### Stage A CPT @ 256K with DeepSpeed ZeRO-3 + CPU offload.
### Use this if DS Z3 256K smoke validates. Otherwise fall back to
### stage_a_v2_128k_fsdp2.yaml.

### model
model_name_or_path: /home/user01/Minko/models/Qwen3.5-4B
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

### method
stage: pt
do_train: true
finetuning_type: full
deepspeed: configs/deepspeed/ds_z3_offload.json

### dataset
dataset: longluxi_packed_v2_256k
dataset_dir: external/LLaMA-Factory/data
template: empty
cutoff_len: 262144
max_samples: 0
preprocessing_num_workers: 8
dataloader_num_workers: 2
packing: false
neat_packing: false

### output
output_dir: checkpoints/stage_a_v2_256k
logging_steps: 1
save_steps: 50
save_total_limit: 3
plot_loss: true
overwrite_output_dir: true
save_only_model: true
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 2    # effective batch = 2 × 4 cards = 8 seqs/step
                                  # halved vs 128K to keep step compute similar
max_steps: 250
learning_rate: 3.0e-5
warmup_ratio: 0.05
lr_scheduler_type: cosine
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
